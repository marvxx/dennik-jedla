<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Denník jedla</title>
  <meta name="description" content="Jednoduchý denník jedla a tráviacich ťažkostí. Údaje zostávajú len v telefóne.">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1d1b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Denník">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Zapísať</h1>
  </header>

  <main>
    <section id="view-add" class="view active" aria-label="Zapísať">
      <div id="backup-banner"></div>
      <form id="entry-form" autocomplete="off" novalidate></form>
      <div id="today-card"></div>
    </section>

    <section id="view-list" class="view" aria-label="Prehľad"></section>
    <section id="view-insights" class="view" aria-label="Súvislosti"></section>
    <section id="view-settings" class="view" aria-label="Nastavenia"></section>
  </main>

  <nav class="tabbar" aria-label="Hlavné menu">
    <button type="button" class="tab active" data-view="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Zapísať</span>
    </button>
    <button type="button" class="tab" data-view="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Prehľad</span>
    </button>
    <button type="button" class="tab" data-view="insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      <span>Súvislosti</span>
    </button>
    <button type="button" class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>Nastavenia</span>
    </button>
  </nav>

  <dialog id="day-dialog"></dialog>
  <dialog id="trace-dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <script src="analysis.js"></script>
  <script src="app.js"></script>
</body>
</html>
